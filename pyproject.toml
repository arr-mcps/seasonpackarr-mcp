[project]
name = "seasonpackarr-mcp"
version = "0.1.0"
description = "MCP server for SeasonPackArr's REST API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0", "httpx>=0.27.0"]

[project.scripts]
seasonpackarr-mcp = "seasonpackarr_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits a real SeasonPackArr instance (needs SEASONPACKARR_URL)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
